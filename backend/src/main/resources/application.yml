spring:
  application:
    name: veckt-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${SPRING_DATASOURCE_VALIDATION_TIMEOUT:5000}
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:1025}
  servlet:
    multipart:
      max-file-size: ${VECKT_MAX_FILE_SIZE:104857600B}
      max-request-size: ${VECKT_MAX_REQUEST_SIZE:524288000B}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false

veckt:
  security:
    platform-secret: ${VECKT_PLATFORM_JWT_SECRET}
    tenant-secret: ${VECKT_TENANT_JWT_SECRET}
    issuer: ${VECKT_JWT_ISSUER:veckt}
    access-token-minutes: ${VECKT_ACCESS_TOKEN_MINUTES:30}
  initial-bootstrap:
    enabled: ${VECKT_INITIAL_BOOTSTRAP_ENABLED:false}
    admin-name: ${VECKT_INITIAL_ADMIN_NAME:}
    admin-email: ${VECKT_INITIAL_ADMIN_EMAIL:}
    admin-password: ${VECKT_INITIAL_ADMIN_PASSWORD:}
  storage:
    local-root: ${APP_STORAGE_PATH}
  web:
    allowed-origins: ${APP_ALLOWED_ORIGINS}
  public:
    website-url: ${APP_PUBLIC_WEBSITE_URL}
    frontend-url: ${APP_PUBLIC_FRONTEND_URL}
    backend-url: ${APP_PUBLIC_BACKEND_URL}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.veckt: INFO
