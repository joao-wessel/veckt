name: ${VECTK_COMPOSE_PROJECT:-vectk}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TZ: ${APP_TIMEZONE:?Defina APP_TIMEZONE no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vectk_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      VECTK_PLATFORM_JWT_SECRET: ${VECTK_PLATFORM_JWT_SECRET:?Defina VECTK_PLATFORM_JWT_SECRET no arquivo .env}
      VECTK_TENANT_JWT_SECRET: ${VECTK_TENANT_JWT_SECRET:?Defina VECTK_TENANT_JWT_SECRET no arquivo .env}
      VECTK_JWT_ISSUER: ${VECTK_JWT_ISSUER:-vectk}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:?Defina APP_ALLOWED_ORIGINS no arquivo .env}
      APP_PUBLIC_WEBSITE_URL: ${APP_PUBLIC_WEBSITE_URL:?Defina APP_PUBLIC_WEBSITE_URL no arquivo .env}
      APP_PUBLIC_FRONTEND_URL: ${APP_PUBLIC_FRONTEND_URL:?Defina APP_PUBLIC_FRONTEND_URL no arquivo .env}
      APP_PUBLIC_BACKEND_URL: ${APP_PUBLIC_BACKEND_URL:?Defina APP_PUBLIC_BACKEND_URL no arquivo .env}
      APP_STORAGE_PATH: ${APP_STORAGE_PATH:-/app/storage}
      VECTK_MAX_FILE_SIZE: ${VECTK_MAX_FILE_SIZE:-104857600B}
      VECTK_MAX_REQUEST_SIZE: ${VECTK_MAX_REQUEST_SIZE:-524288000B}
      VECTK_INITIAL_BOOTSTRAP_ENABLED: ${VECTK_INITIAL_BOOTSTRAP_ENABLED:-false}
      VECTK_INITIAL_ADMIN_NAME: ${VECTK_INITIAL_ADMIN_NAME:-}
      VECTK_INITIAL_ADMIN_EMAIL: ${VECTK_INITIAL_ADMIN_EMAIL:-}
      VECTK_INITIAL_ADMIN_PASSWORD: ${VECTK_INITIAL_ADMIN_PASSWORD:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      TZ: ${APP_TIMEZONE:?Defina APP_TIMEZONE no arquivo .env}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${APP_TIMEZONE:?Defina APP_TIMEZONE no arquivo .env}
    volumes:
      - uploads:${APP_STORAGE_PATH:-/app/storage}
    networks:
      - vectk_internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - vectk_internal
    depends_on:
      backend:
        condition: service_healthy

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Defina APP_DOMAIN no arquivo .env}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-500m}
      NGINX_ENVSUBST_FILTER: APP_DOMAIN|NGINX_CLIENT_MAX_BODY_SIZE
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/http.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - vectk_public
      - vectk_internal
    depends_on:
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Defina APP_DOMAIN no arquivo .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Defina LETSENCRYPT_EMAIL no arquivo .env}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - vectk_public
    entrypoint: /bin/sh
    command: >-
      -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $$!; done'

volumes:
  postgres_data:
    name: ${VECTK_VOLUME_PREFIX:-vectk_staging}_postgres_data
  uploads:
    name: ${VECTK_VOLUME_PREFIX:-vectk_staging}_uploads
  certbot_conf:
    name: ${VECTK_VOLUME_PREFIX:-vectk_staging}_certbot_conf
  certbot_www:
    name: ${VECTK_VOLUME_PREFIX:-vectk_staging}_certbot_www

networks:
  vectk_public:
    name: ${VECTK_VOLUME_PREFIX:-vectk_staging}_public
  vectk_internal:
    name: ${VECTK_VOLUME_PREFIX:-vectk_staging}_internal
    internal: true
